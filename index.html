<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mahjong</title>
<meta name="theme-color" content="#1f6f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mahjong">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --felt: #1f6f4a;
    --felt-dark: #154d33;
    --tile: #fffaf0;
    --tile-side: #d9c7a0;
    --tile-side2: #b9a274;
    --sel: #ffd84d;
    --hint: #6fd3ff;
    --text: #fff;
    --btn: rgba(255,255,255,.14);
    --btn-active: rgba(255,255,255,.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; -webkit-touch-callout: none; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at center, var(--felt) 0%, var(--felt-dark) 100%);
    background-color: var(--felt-dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app { display: flex; flex-direction: column; height: 100%;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; flex-wrap: wrap; }
  .stats { display: flex; gap: 14px; font-size: 17px; font-weight: 600; margin-right: auto; flex-wrap: wrap; }
  .stats span { white-space: nowrap; }
  button {
    font: inherit; font-size: 17px; font-weight: 600; color: var(--text);
    background: var(--btn); border: 0; border-radius: 14px;
    padding: 10px 14px; min-height: 48px; cursor: pointer;
  }
  button:active { background: var(--btn-active); transform: scale(.97); }
  button:disabled { opacity: .4; }
  #board-wrap { flex: 1; position: relative; overflow: hidden; }
  #board { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
  .tile {
    position: absolute; border-radius: 10px;
    background: linear-gradient(145deg, #ffffff 0%, var(--tile) 60%, #f3ead6 100%);
    box-shadow: 1px 1px 0 var(--tile-side), 2px 2px 0 var(--tile-side), 3px 3px 0 var(--tile-side),
                4px 4px 0 var(--tile-side2), 5px 5px 0 var(--tile-side2), 6px 6px 0 var(--tile-side2),
                7px 8px 10px rgba(0,0,0,.35);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s, opacity .25s, filter .2s;
    border: 2px solid #e8dcc0;
  }
  .tile .face { font-size: 46px; line-height: 1; pointer-events: none; display: flex; }
  .tile .face svg { width: 50px; height: 62px; display: block; }
  .tile .face img { width: 56px; height: 56px; object-fit: contain; display: block; }
  #crestBox { display: none; margin-top: 10px; }
  #crestBox.show { display: block; }
  #crestBox .row { margin-top: 0; }
  .filebtn { position: relative; flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 600; background: #eef3ef; border-radius: 14px; min-height: 48px; padding: 10px 14px; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; }
  #crestInfo { font-size: 14px; color: #4b5d52; margin: 6px 0 0; }
  #themes { grid-template-columns: repeat(2, 1fr); }
  .tile.blocked.dim { filter: brightness(.72) saturate(.75); }
  .tile.selected { background: var(--sel); border-color: #e0a800; transform: translate(-2px,-3px); }
  .tile.hint { animation: pulse .5s ease-in-out 4 alternate; }
  .tile.shake { animation: shake .3s; }
  .tile.gone { opacity: 0; transform: scale(.6) translateY(-20px); pointer-events: none; }
  @keyframes pulse { from { background: var(--tile); } to { background: var(--hint); transform: translate(-2px,-3px); } }
  @keyframes shake { 0%,100% { margin-left: 0 } 25% { margin-left: -6px } 75% { margin-left: 6px } }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 100000; padding: 16px;
  }
  .overlay.show { display: flex; }
  .panel {
    background: #fff; color: #1d2b22; border-radius: 22px; padding: 22px;
    width: min(520px, 100%); max-height: 100%; overflow: auto; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .panel h1 { margin: 4px 0 6px; font-size: 32px; }
  .panel h2 { margin: 18px 0 8px; font-size: 18px; color: #4b5d52; }
  .panel p { margin: 6px 0; font-size: 18px; }
  .panel .big { font-size: 64px; margin: 0; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .panel button { color: #1d2b22; background: #eef3ef; }
  .panel button.on { background: var(--felt); color: #fff; }
  .panel .primary { background: var(--felt); color: #fff; width: 100%; margin-top: 18px; font-size: 21px; min-height: 58px; }
  .panel .row { display: flex; gap: 8px; margin-top: 10px; }
  .panel .row button { flex: 1; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 18px; padding: 8px 2px; text-align: left; }
  .best { font-size: 15px; color: #4b5d52; margin-top: 10px; }
  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: rgba(0,0,0,.75); padding: 12px 20px; border-radius: 14px; font-size: 18px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 100001; white-space: nowrap;
  }
  #toast.show { opacity: 1; }
  @media (max-height: 860px) {
    .panel { padding: 14px 18px; }
    .panel .big { font-size: 40px; }
    .panel h1 { font-size: 26px; margin: 0 0 4px; }
    .panel h2 { margin: 10px 0 6px; font-size: 16px; }
    .panel p { font-size: 16px; margin: 4px 0; }
    .toggle { padding: 4px 2px; font-size: 16px; }
    .panel .primary { margin-top: 10px; min-height: 50px; }
  }
  @media (max-width: 600px) {
    button { padding: 8px 10px; font-size: 15px; min-height: 44px; }
    .stats { font-size: 15px; gap: 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stats">
      <span>🀄 <b id="left">0</b></span>
      <span>✋ <b id="moves">0</b></span>
      <span>⏱ <b id="time">0:00</b></span>
    </div>
    <button id="btnHint" title="Podpowiedź">💡 Podpowiedź</button>
    <button id="btnUndo" title="Cofnij">↩️ Cofnij</button>
    <button id="btnShuffle" title="Tasuj">🔀 Tasuj</button>
    <button id="btnMusic" title="Muzyka">🎵</button>
    <button id="btnMenu" title="Menu">☰ Menu</button>
  </header>
  <div id="board-wrap"><div id="board"></div></div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <p class="big">🀄</p>
    <h1>Mahjong</h1>
    <p>Dotknij dwóch takich samych <b>wolnych</b> kafelków, żeby je zdjąć.</p>
    <p style="font-size:15px;color:#4b5d52">Kafelek jest wolny, gdy nic na nim nie leży i ma pusty bok z lewej albo z prawej.</p>
    <h2>Poziom</h2>
    <div class="choices" id="levels"></div>
    <h2>Obrazki</h2>
    <div class="choices" id="themes"></div>
    <div id="crestBox">
      <label class="toggle">Prawdziwe herby klubów <input type="checkbox" id="optCrests"></label>
      <p id="crestInfo"></p>
    </div>
    <h2>Ustawienia</h2>
    <label class="toggle">Przyciemniaj zablokowane kafelki <input type="checkbox" id="optDim"></label>
    <label class="toggle">Dźwięki <input type="checkbox" id="optSound"></label>
    <label class="toggle">Muzyka w tle <input type="checkbox" id="optMusic"></label>
    <div class="best" id="bestInfo"></div>
    <button class="primary" id="btnStart">▶️ Nowa gra</button>
    <button class="primary" id="btnResume" style="background:#eef3ef;color:#1d2b22;margin-top:8px">Wróć do gry</button>
  </div>
</div>

<div class="overlay" id="win">
  <div class="panel">
    <p class="big">🏆</p>
    <h1>Brawo!</h1>
    <p id="winText"></p>
    <p id="winBest" style="font-weight:700;color:#1f6f4a"></p>
    <button class="primary" id="btnAgain">▶️ Zagraj jeszcze raz</button>
    <div class="row"><button id="btnWinMenu">☰ Zmień poziom</button></div>
  </div>
</div>

<div class="overlay" id="stuck">
  <div class="panel">
    <p class="big">🤔</p>
    <h1>Brak ruchów</h1>
    <p>Nie ma już pasujących wolnych par.</p>
    <button class="primary" id="btnStuckShuffle">🔀 Potasuj kafelki</button>
    <div class="row"><button id="btnStuckUndo">↩️ Cofnij</button><button id="btnStuckNew">Nowa gra</button></div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  // ---------- Dane ----------
  const THEMES = {
    animals: { name: '🐶 Zwierzęta', tiles: ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🦕','🦖','🦆','🦉','🐴','🦄','🐝','🐞','🦋','🐢','🐍','🐙','🦀','🐠','🐬','🐳','🦈','🐘','🦒'] },
    food:    { name: '🍎 Jedzenie',  tiles: ['🍎','🍐','🍊','🍋','🍌','🍉','🍇','🍓','🥑','🍒','🍑','🥭','🍍','🥥','🥝','🍅','🥕','🌽','🥦','🍄','🥨','🧀','🍕','🍔','🍟','🌭','🍩','🍪','🎂','🍭','🍬','🍫','🍿','🧁','🍦','🥐'] },
    fun:     { name: '🚀 Zabawa',    tiles: ['🚗','🚕','🚌','🚓','🚑','🚒','🚜','🏎️','🚲','🛴','🚂','✈️','🚁','🚀','🛸','⛵','⚽','🏀','🏈','⚾','🎾','🏐','🎱','🏓','🥊','🎮','🎲','🧩','🎸','🥁','🎺','🎨','🪁','🎈','⭐','🌈'] },
  };

  // Liga Mistrzów 2026/27 – 36 klubów fazy ligowej. To NIE są oficjalne herby
  // (chronione znaki towarowe), tylko własne tarcze w barwach klubu ze skrótem nazwy.
  // [skrót, kolor 1, kolor 2, wzór, nazwa]
  const CLUBS = [
    ['AEK', '#f5c400', '#111111', 'chief',   'AEK Ateny'],
    ['ARS', '#e30613', '#ffffff', 'chief',   'Arsenal'],
    ['AVL', '#7a003c', '#95bfe5', 'chief',   'Aston Villa'],
    ['ATM', '#cb3524', '#ffffff', 'stripes', 'Atlético Madryt'],
    ['BAR', '#a50044', '#004d98', 'stripes', 'FC Barcelona'],
    ['BAY', '#dc052d', '#ffffff', 'solid',   'Bayern Monachium'],
    ['BOD', '#ffd200', '#111111', 'band',    'Bodø/Glimt'],
    ['BVB', '#fde100', '#111111', 'solid',   'Borussia Dortmund'],
    ['BRU', '#0067b1', '#111111', 'stripes', 'Club Brugge'],
    ['COM', '#1d4f91', '#ffffff', 'solid',   'Como'],
    ['FEN', '#0a1f5c', '#f7d117', 'stripes', 'Fenerbahçe'],
    ['FEY', '#e2001a', '#ffffff', 'halves',  'Feyenoord'],
    ['GAL', '#a90432', '#fdb912', 'halves',  'Galatasaray'],
    ['INT', '#0068a8', '#111111', 'stripes', 'Inter Mediolan'],
    ['LASK','#111111', '#ffffff', 'stripes', 'LASK Linz'],
    ['RBL', '#ffffff', '#dd0741', 'band',    'RB Lipsk'],
    ['LENS','#ec1c24', '#ffd200', 'halves',  'RC Lens'],
    ['LOSC','#e01e13', '#1b2a5c', 'chief',   'Lille'],
    ['LIV', '#c8102e', '#00b2a9', 'solid',   'Liverpool'],
    ['MCI', '#6cabdd', '#ffffff', 'solid',   'Manchester City'],
    ['MUN', '#da291c', '#111111', 'chief',   'Manchester United'],
    ['NAP', '#12a0d7', '#ffffff', 'band',    'Napoli'],
    ['PSG', '#004170', '#da291c', 'band',    'Paris Saint-Germain'],
    ['POR', '#0050a0', '#ffffff', 'stripes', 'FC Porto'],
    ['PSV', '#ed1c24', '#ffffff', 'stripes', 'PSV Eindhoven'],
    ['BET', '#00954c', '#ffffff', 'stripes', 'Real Betis'],
    ['RMA', '#ffffff', '#febe10', 'band',    'Real Madryt'],
    ['ROM', '#8e1f2f', '#f0bc42', 'halves',  'AS Roma'],
    ['SAB', '#e5007e', '#111111', 'chief',   'Sabah'],
    ['SHA', '#f26522', '#111111', 'chief',   'Szachtar Donieck'],
    ['SLA', '#e1001a', '#ffffff', 'halves',  'Slavia Praga'],
    ['SLO', '#6fb7e6', '#ffffff', 'hoops',   'Slovan Bratysława'],
    ['SCP', '#008057', '#ffffff', 'hoops',   'Sporting CP'],
    ['VFB', '#ffffff', '#e32219', 'band',    'VfB Stuttgart'],
    ['VIK', '#7a1f2b', '#c9a24a', 'band',    'Viking'],
    ['VIL', '#ffe667', '#005187', 'chief',   'Villarreal'],
  ];
  function shield([code, c1, c2, pat, name], i) {
    const id = 'cl' + i;
    let fill = `<rect width="100" height="120" fill="${c1}"/>`;
    if (pat === 'stripes') for (let x = 20; x < 100; x += 40) fill += `<rect x="${x}" width="20" height="120" fill="${c2}"/>`;
    if (pat === 'hoops')   for (let y = 20; y < 120; y += 40) fill += `<rect y="${y}" width="100" height="20" fill="${c2}"/>`;
    if (pat === 'halves')  fill += `<rect x="50" width="50" height="120" fill="${c2}"/>`;
    if (pat === 'band')    fill += `<rect y="22" width="100" height="18" fill="${c2}"/>`;
    if (pat === 'chief')   fill += `<rect width="100" height="30" fill="${c2}"/>`;
    const fs = code.length > 3 ? 26 : 32;
    return `<svg viewBox="0 0 100 120" role="img" aria-label="${name}">
      <clipPath id="${id}"><path d="M8 6H92V58C92 90 72 106 50 116C28 106 8 90 8 58Z"/></clipPath>
      <g clip-path="url(#${id})">${fill}</g>
      <path d="M8 6H92V58C92 90 72 106 50 116C28 106 8 90 8 58Z" fill="none" stroke="#1d1d1d" stroke-width="5"/>
      <text x="50" y="80" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="${fs}" fill="#fff" stroke="#111" stroke-width="7" stroke-linejoin="round" paint-order="stroke">${code}</text>
    </svg>`;
  }
  // Prawdziwe herby nie są częścią gry (ani publicznej strony): użytkownik wgrywa je z pliku
  // na swoim tablecie, a gra trzyma je wyłącznie w pamięci tego urządzenia.
  let crests = null;
  function clubTiles() {
    return CLUBS.map((c, i) => settings.crests && crests && crests[c[0]]
      ? `<img src="${crests[c[0]]}" alt="${c[4]}" draggable="false">` : shield(c, i));
  }
  THEMES.clubs = { name: '⚽ Liga Mistrzów', tiles: [] };

  // Współrzędne w półkafelkach: kafelek zajmuje [x,x+2) × [y,y+2) na warstwie z.
  function rect(arr, w, h, z, ox, oy) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) arr.push({ x: ox + 2 * i, y: oy + 2 * j, z });
    return arr;
  }
  const LEVELS = {
    easy: { name: '😊 Łatwy', kinds: 12, build() {
      const a = []; rect(a, 6, 4, 0, 0, 0); rect(a, 4, 2, 1, 2, 2); rect(a, 2, 1, 2, 4, 3); return a; } },
    medium: { name: '🙂 Średni', kinds: 22, build() {
      const a = []; rect(a, 8, 6, 0, 0, 0); rect(a, 6, 4, 1, 2, 2); rect(a, 4, 2, 2, 4, 4); rect(a, 2, 1, 3, 6, 5);
      a.push({ x: -2, y: 5, z: 0 }, { x: 16, y: 5, z: 0 }); return a; } },
    hard: { name: '😎 Trudny', kinds: 36, build() {
      const a = []; rect(a, 12, 6, 0, 0, 0); rect(a, 10, 4, 1, 2, 2); rect(a, 6, 4, 2, 6, 2); rect(a, 2, 2, 3, 10, 4);
      a.push({ x: -4, y: 5, z: 0 }, { x: -2, y: 5, z: 0 }, { x: 24, y: 5, z: 0 }, { x: 26, y: 5, z: 0 }); return a; } },
  };

  // ---------- Pamięć (bezpieczna) ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('mj_' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('mj_' + k, JSON.stringify(v)); return true; } catch { return false; } },
    del(k) { try { localStorage.removeItem('mj_' + k); } catch {} },
  };

  const settings = Object.assign({ level: 'easy', theme: 'animals', dim: true, sound: true, crests: true, music: true }, store.get('settings', {}));

  // ---------- Stan gry ----------
  let tiles = [];       // {x,y,z,t,alive}
  let history = [];     // [[i,j], ...]
  let selected = -1;
  let moves = 0;
  let elapsed = 0;      // sekundy
  let running = false;
  let game = null;      // {level, theme}
  let els = [];

  const $ = id => document.getElementById(id);
  const boardEl = $('board'), wrapEl = $('board-wrap');

  // ---------- Logika ----------
  function isFree(i, alive) {
    const a = tiles[i];
    let left = false, right = false;
    for (let j = 0; j < tiles.length; j++) {
      if (j === i || !alive[j]) continue;
      const b = tiles[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      if (Math.abs(dy) >= 2) continue;
      if (b.z > a.z) { if (Math.abs(dx) < 2) return false; }
      else if (b.z === a.z) { if (dx === -2) left = true; else if (dx === 2) right = true; }
    }
    return !(left && right);
  }
  const aliveArr = () => tiles.map(t => t.alive);

  function freeList(alive) {
    const out = [];
    for (let i = 0; i < tiles.length; i++) if (alive[i] && isFree(i, alive)) out.push(i);
    return out;
  }

  function shuffleArr(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // Rozdaje typy kafelków tak, żeby układ na pewno dało się ułożyć:
  // symuluje zdejmowanie losowych wolnych par i nadaje każdej parze ten sam obrazek.
  function dealSolvable(indices, pairTypes, strict = false) {
    for (let attempt = 0; attempt < 400; attempt++) {
      const alive = tiles.map((_, i) => indices.includes(i));
      const pairs = [];
      let ok = true;
      for (let n = 0; n < indices.length / 2; n++) {
        const free = shuffleArr(freeList(alive));
        if (free.length < 2) { ok = false; break; }
        const a = free[0], b = free[1];
        alive[a] = alive[b] = false;
        pairs.push([a, b]);
      }
      if (!ok) continue;
      const types = shuffleArr(pairTypes.slice());
      pairs.forEach(([a, b], k) => { tiles[a].t = types[k]; tiles[b].t = types[k]; });
      return true;
    }
    if (strict) return false;
    // awaryjnie (praktycznie się nie zdarza): zwykłe losowanie
    const flat = shuffleArr(pairTypes.flatMap(t => [t, t]));
    indices.forEach((i, k) => tiles[i].t = flat[k]);
    return false;
  }

  function newGame() {
    const L = LEVELS[settings.level];
    game = { level: settings.level, theme: settings.theme };
    tiles = L.build().map(p => ({ ...p, t: 0, alive: true }));
    const nPairs = tiles.length / 2;
    const kinds = Math.min(L.kinds, THEMES[settings.theme].tiles.length);
    const kindOrder = shuffleArr([...Array(THEMES[settings.theme].tiles.length).keys()]).slice(0, kinds);
    const pairTypes = [];
    for (let p = 0; p < nPairs; p++) pairTypes.push(kindOrder[p % kinds]);
    dealSolvable(tiles.map((_, i) => i), pairTypes);
    history = []; selected = -1; moves = 0; elapsed = 0; running = true;
    render(); save(); checkStuck();
  }

  function reshuffle() {
    // Jeśli układu nie da się już dokończyć (np. dwa kafelki leżą jeden na drugim),
    // cofamy tyle ruchów, ile trzeba, i dopiero wtedy tasujemy.
    let undone = 0;
    for (;;) {
      const idx = tiles.map((t, i) => t.alive ? i : -1).filter(i => i >= 0);
      if (idx.length < 2) return;
      const types = idx.map(i => tiles[i].t).sort((a, b) => a - b);
      const pairTypes = []; for (let k = 0; k < types.length; k += 2) pairTypes.push(types[k]);
      if (dealSolvable(idx, pairTypes, true) || history.length === 0) {
        if (history.length === 0 && undone === 0) dealSolvable(idx, pairTypes);
        break;
      }
      history.pop().forEach(i => tiles[i].alive = true);
      undone++;
    }
    selected = -1; running = true;
    render(); save();
    toast(undone ? `🔀 Cofnięto ${undone} ${undone === 1 ? 'ruch' : undone < 5 ? 'ruchy' : 'ruchów'} i potasowano` : '🔀 Potasowano');
    checkStuck();
  }

  function findMoves(limit = Infinity) {
    const alive = aliveArr();
    const free = freeList(alive);
    const byType = {};
    const pairs = [];
    for (const i of free) (byType[tiles[i].t] ||= []).push(i);
    for (const k in byType) {
      const g = byType[k];
      for (let a = 0; a < g.length; a++) for (let b = a + 1; b < g.length; b++) {
        pairs.push([g[a], g[b]]); if (pairs.length >= limit) return pairs;
      }
    }
    return pairs;
  }

  function tap(i) {
    if (!running || !tiles[i].alive) return;
    if (!isFree(i, aliveArr())) { shake(i); beep(180, .08); return; }
    if (selected === i) { selected = -1; updateClasses(); return; }
    if (selected >= 0 && tiles[selected].t === tiles[i].t) {
      const a = selected; selected = -1;
      tiles[a].alive = tiles[i].alive = false;
      history.push([a, i]); moves++;
      beep(660, .07); setTimeout(() => beep(880, .09), 70);
      updateClasses(); updateStats(); save();
      if (tiles.every(t => !t.alive)) return win();
      checkStuck();
      return;
    }
    selected = i; beep(440, .04); updateClasses();
  }

  function undo() {
    const last = history.pop();
    if (!last) { toast('Nie ma czego cofać'); return; }
    last.forEach(i => tiles[i].alive = true);
    moves = Math.max(0, moves - 1);
    selected = -1; running = true;
    updateClasses(); updateStats(); save();
  }

  function hint() {
    const m = findMoves(1)[0];
    if (!m) { showStuck(); return; }
    m.forEach(i => { const e = els[i]; e.classList.remove('hint'); void e.offsetWidth; e.classList.add('hint'); });
    setTimeout(() => m.forEach(i => els[i].classList.remove('hint')), 2100);
  }

  function checkStuck() {
    if (tiles.some(t => t.alive) && findMoves(1).length === 0) setTimeout(showStuck, 400);
  }
  function showStuck() { $('stuck').classList.add('show'); }

  function win() {
    running = false;
    store.del('game');
    const key = 'best_' + game.level;
    const best = store.get(key, null);
    const isBest = best == null || elapsed < best;
    if (isBest) store.set(key, elapsed);
    $('winText').textContent = `Poziom ${LEVELS[game.level].name.replace(/^\S+\s/, '')} ułożony w ${fmt(elapsed)}.`;
    $('winBest').textContent = isBest ? '⭐ Nowy rekord! ⭐' : `Rekord: ${fmt(best)}`;
    [523, 659, 784, 1047].forEach((f, k) => setTimeout(() => beep(f, .15), k * 140));
    setTimeout(() => $('win').classList.add('show'), 450);
  }

  // ---------- Widok ----------
  const UX = 32, UY = 40, DEPTH = 6;  // px na półkafelek; przesunięcie warstwy
  let boardW = 0, boardH = 0;

  function render() {
    boardEl.innerHTML = '';
    const pics = THEMES[game.theme].tiles;
    const minX = Math.min(...tiles.map(t => t.x)), minY = Math.min(...tiles.map(t => t.y));
    const maxX = Math.max(...tiles.map(t => t.x)), maxY = Math.max(...tiles.map(t => t.y));
    const maxZ = Math.max(...tiles.map(t => t.z));
    boardW = (maxX - minX + 2) * UX + maxZ * DEPTH + DEPTH;
    boardH = (maxY - minY + 2) * UY + maxZ * DEPTH + DEPTH;
    boardEl.style.width = boardW + 'px'; boardEl.style.height = boardH + 'px';
    els = tiles.map((t, i) => {
      const e = document.createElement('div');
      e.className = 'tile';
      e.style.left = ((t.x - minX) * UX + (maxZ - t.z) * DEPTH) + 'px';
      e.style.top = ((t.y - minY) * UY + (maxZ - t.z) * DEPTH) + 'px';
      e.style.width = (2 * UX - DEPTH) + 'px';
      e.style.height = (2 * UY - DEPTH) + 'px';
      e.style.zIndex = t.z * 1000 + t.y * 30 + t.x + 10;
      e.innerHTML = `<span class="face">${pics[t.t]}</span>`;
      e.addEventListener('pointerdown', ev => { ev.preventDefault(); tap(i); });
      boardEl.appendChild(e);
      return e;
    });
    layout(); updateClasses(); updateStats();
  }

  function layout() {
    if (!boardW) return;
    const pad = 12;
    const s = Math.min((wrapEl.clientWidth - pad * 2) / boardW, (wrapEl.clientHeight - pad * 2) / boardH, 1.6);
    boardEl.style.transform = `scale(${s}) translate(${-boardW / 2}px, ${-boardH / 2}px)`;
  }

  function updateClasses() {
    const alive = aliveArr();
    tiles.forEach((t, i) => {
      const e = els[i];
      e.classList.toggle('gone', !t.alive);
      e.classList.toggle('selected', i === selected);
      const blocked = t.alive && !isFree(i, alive);
      e.classList.toggle('blocked', blocked);
      e.classList.toggle('dim', settings.dim);
    });
    $('btnUndo').disabled = history.length === 0;
  }

  function updateStats() {
    $('left').textContent = tiles.filter(t => t.alive).length;
    $('moves').textContent = findMoves().length;
    $('time').textContent = fmt(elapsed);
  }

  function shake(i) { const e = els[i]; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
  }

  // ---------- Dźwięk ----------
  let actx;
  function audio() {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended' && !document.hidden) actx.resume();
    return actx;
  }
  function beep(freq, dur) {
    if (!settings.sound) return;
    try {
      audio();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur + .05);
      o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur + .06);
    } catch {}
  }

  // ---------- Muzyka w tle ----------
  // Własny, generowany na bieżąco motyw (pentatonika D-dur): akordy, bas i melodia „spacerująca”
  // po skali. Nie ma pliku z nagraniem, więc działa offline i nie ma kwestii praw autorskich.
  const music = (() => {
    const BPM = 76, E8 = 60 / BPM / 2;                 // długość ósemki w sekundach
    const SCALE = [62, 64, 66, 69, 71, 74, 76, 78, 81]; // D E F# A H d e f# a
    const PROG = [[50, 62, 66, 69], [47, 59, 62, 66], [43, 59, 62, 67], [45, 61, 64, 69],
                  [50, 62, 66, 69], [47, 59, 62, 66], [40, 59, 64, 67], [45, 57, 61, 64]]; // bas + akord
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    let bus, echo, timer = null, step = 0, next = 0, idx = 4;

    function setup(ctx) {
      if (bus) return;
      bus = ctx.createGain(); bus.gain.value = 0.0001; bus.connect(ctx.destination);
      echo = ctx.createDelay(); echo.delayTime.value = E8 * 3;
      const fb = ctx.createGain(); fb.gain.value = 0.28;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      echo.connect(lp); lp.connect(fb); fb.connect(echo); lp.connect(bus);
    }
    function note(ctx, type, midi, t, dur, vol, attack, toEcho) {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = type; o.frequency.value = hz(midi);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(bus); if (toEcho) g.connect(echo);
      o.start(t); o.stop(t + dur + 0.05);
    }
    function play(ctx, s, t) {
      const pos = s % 8, chord = PROG[Math.floor(s / 8) % PROG.length];
      if (pos === 0) {
        note(ctx, 'sine', chord[0], t, E8 * 7.5, 0.35, 0.02);
        for (const m of chord.slice(1)) note(ctx, 'sine', m, t, E8 * 8, 0.05, 0.8);
      }
      if (pos === 4) note(ctx, 'sine', chord[0] + 12, t, E8 * 3.5, 0.18, 0.02);
      // melodia: krok o 0–2 stopnie skali, na mocnej części taktu dźwięk z akordu
      if (pos % 2 === 1 && Math.random() < 0.55) return;
      if (Math.random() < 0.12) return;
      idx = Math.max(0, Math.min(SCALE.length - 1, idx + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
      let m = SCALE[idx];
      if (pos === 0) {
        const pcs = chord.slice(1).map(c => c % 12);
        const cand = SCALE.map((n, i) => [n, i]).filter(([n]) => pcs.includes(n % 12));
        if (cand.length) { const best = cand.reduce((a, b) => Math.abs(b[1] - idx) < Math.abs(a[1] - idx) ? b : a); m = best[0]; idx = best[1]; }
      }
      note(ctx, 'triangle', m, t, E8 * 2.6, 0.16, 0.01, true);
    }
    function tick() {
      const ctx = actx;
      if (!ctx || ctx.state !== 'running') return;
      if (next < ctx.currentTime) next = ctx.currentTime + 0.05;
      while (next < ctx.currentTime + 0.25) { play(ctx, step++, next); next += E8; }
    }
    return {
      start() {
        try {
          const ctx = audio(); setup(ctx);
          bus.gain.cancelScheduledValues(ctx.currentTime);
          bus.gain.setTargetAtTime(0.5, ctx.currentTime, 0.6);
          if (!timer) { step = 0; next = 0; timer = setInterval(tick, 50); tick(); }
        } catch {}
      },
      stop() {
        if (!timer) return;
        clearInterval(timer); timer = null;
        try { bus.gain.setTargetAtTime(0.0001, actx.currentTime, 0.15); } catch {}
      },
      get on() { return !!timer; },
    };
  })();

  function updateMusicBtn() {
    const b = $('btnMusic');
    b.textContent = settings.music ? '🎵' : '🔇';
    b.title = settings.music ? 'Wyłącz muzykę' : 'Włącz muzykę';
    b.style.opacity = settings.music ? '1' : '.6';
  }
  function setMusic(on) {
    settings.music = on; saveSettings(); updateMusicBtn();
    if (on) music.start(); else music.stop();
    $('optMusic').checked = on;
  }
  $('btnMusic').onclick = () => setMusic(!settings.music);
  $('optMusic').onchange = e => setMusic(e.target.checked);
  // Przeglądarki pozwalają włączyć dźwięk dopiero po dotknięciu ekranu – startujemy przy pierwszym dotyku.
  // (iPad odblokowuje dźwięk dopiero przy podniesieniu palca, dlatego pointerup/touchend).
  const unlock = () => {
    if (document.hidden) return;
    if (settings.music && !music.on) music.start();
    else if (settings.sound) try { audio(); } catch {}
  };
  document.addEventListener('pointerup', unlock, true);
  document.addEventListener('touchend', unlock, true);
  document.addEventListener('visibilitychange', () => {
    if (!actx) return;
    if (document.hidden) actx.suspend().catch(() => {});
    else if (settings.music || settings.sound) actx.resume().catch(() => {});
  });
  updateMusicBtn();

  // ---------- Zapis ----------
  function save() {
    if (!game) return;
    store.set('game', { game, tiles, history, moves, elapsed });
  }
  function load() {
    const s = store.get('game', null);
    if (!s || !s.tiles || !LEVELS[s.game?.level] || !THEMES[s.game?.theme]) return false;
    ({ game, tiles, history, moves, elapsed } = s);
    selected = -1; running = tiles.some(t => t.alive);
    render();
    return running;
  }

  // ---------- Menu ----------
  function buildMenu() {
    const lv = $('levels'); lv.innerHTML = '';
    for (const k in LEVELS) {
      const b = document.createElement('button'); b.textContent = LEVELS[k].name;
      b.className = settings.level === k ? 'on' : '';
      b.onclick = () => { settings.level = k; saveSettings(); buildMenu(); };
      lv.appendChild(b);
    }
    const th = $('themes'); th.innerHTML = '';
    for (const k in THEMES) {
      const b = document.createElement('button'); b.textContent = THEMES[k].name;
      b.className = settings.theme === k ? 'on' : '';
      b.onclick = () => { settings.theme = k; saveSettings(); buildMenu(); };
      th.appendChild(b);
    }
    $('optDim').checked = settings.dim;
    $('optSound').checked = settings.sound;
    $('optMusic').checked = settings.music;
    const best = store.get('best_' + settings.level, null);
    $('bestInfo').textContent = best != null ? `🏆 Rekord na tym poziomie: ${fmt(best)}` : '';
    $('btnResume').style.display = running ? '' : 'none';
    $('crestBox').classList.toggle('show', settings.theme === 'clubs');
    $('optCrests').checked = settings.crests;
    $('crestInfo').textContent = !settings.crests ? 'Wyłączone: gra pokazuje tarcze w barwach klubów.'
      : crests ? '' : 'Herby jeszcze się nie wczytały (potrzebny internet przy pierwszym uruchomieniu).';
  }
  function saveSettings() { store.set('settings', settings); }
  function openMenu() { buildMenu(); $('menu').classList.add('show'); }
  function closeOverlays() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show')); }

  $('optDim').onchange = e => { settings.dim = e.target.checked; saveSettings(); if (els.length) updateClasses(); };
  $('optSound').onchange = e => { settings.sound = e.target.checked; saveSettings(); };
  $('btnStart').onclick = () => { closeOverlays(); newGame(); };
  $('btnResume').onclick = closeOverlays;
  $('btnMenu').onclick = openMenu;
  $('btnHint').onclick = hint;
  $('btnUndo').onclick = undo;
  $('btnShuffle').onclick = reshuffle;
  $('btnAgain').onclick = () => { closeOverlays(); newGame(); };
  $('btnWinMenu').onclick = () => { closeOverlays(); openMenu(); };
  $('btnStuckShuffle').onclick = () => { closeOverlays(); reshuffle(); };
  $('btnStuckUndo').onclick = () => { closeOverlays(); undo(); };
  $('btnStuckNew').onclick = () => { closeOverlays(); openMenu(); };

  // ---------- Zegar ----------
  setInterval(() => {
    const paused = document.hidden || document.querySelector('.overlay.show');
    if (running && !paused) { elapsed++; $('time').textContent = fmt(elapsed); if (elapsed % 5 === 0) save(); }
  }, 1000);

  // Blokada powiększania (podwójne stuknięcie, szczypanie).
  // iOS ignoruje user-scalable=no, więc blokujemy domyślną obsługę dotyku w całości,
  // a przyciski i pola wyboru uruchamiamy sami na pointerup.
  // Elementy z klasą .native (wybór pliku) obsługuje przeglądarka – tylko tak iPad otworzy okno wyboru pliku.
  const blockTouch = e => { if (e.cancelable && !e.target.closest('.native')) e.preventDefault(); };
  document.addEventListener('touchstart', blockTouch, { passive: false });
  document.addEventListener('touchmove', blockTouch, { passive: false });
  document.addEventListener('touchend', blockTouch, { passive: false });
  ['gesturestart', 'gesturechange', 'gestureend', 'dblclick'].forEach(t =>
    document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;   // myszką działa zwykłe kliknięcie
    if (e.target.closest('.native')) return;
    const el = e.target.closest('button, label, input');
    if (!el) return;
    const target = el.tagName === 'LABEL' ? el.querySelector('input') : el;
    if (target && !target.disabled) target.click();
  });

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

  // ---------- Herby ----------
  // Herby są własnością klubów (źródło plików: FootyLogos.com); zestaw do prywatnej, niekomercyjnej zabawy.
  function applyCrests() {
    THEMES.clubs.tiles = clubTiles();
    if (game && game.theme === 'clubs' && els.length) render();
  }
  store.del('crests');   // porządek po wcześniejszej wersji z wgrywaniem pliku
  applyCrests();
  fetch('herby/herby-liga-mistrzow.json').then(r => r.json()).then(data => {
    const ok = {};
    for (const [code] of CLUBS) {
      const v = data && data.clubs && data.clubs[code];
      if (typeof v === 'string' && /^data:image\/(png|webp|jpeg);base64,/.test(v)) ok[code] = v;
    }
    if (Object.keys(ok).length) { crests = ok; applyCrests(); if ($('menu').classList.contains('show')) buildMenu(); }
  }).catch(() => {});
  $('optCrests').onchange = e => { settings.crests = e.target.checked; saveSettings(); applyCrests(); buildMenu(); };

  // ---------- Start ----------
  if (!load()) openMenu();

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
